<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">LLM Hub</title>
  <desc id="desc">A routing hub mark with connected model nodes and the LLM Hub wordmark.</desc>
  <defs>
    <linearGradient id="hub-accent" x1="34" y1="28" x2="182" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.52" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect x="20" y="20" width="180" height="180" rx="34" fill="#0B1120"/>
    <rect x="21" y="21" width="178" height="178" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M67 82H118L153 53" fill="none" stroke="url(#hub-accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M67 138H118L153 167" fill="none" stroke="url(#hub-accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 110H156" fill="none" stroke="url(#hub-accent)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="67" cy="82" r="18" fill="#101A2E" stroke="#67E8F9" stroke-width="8"/>
    <circle cx="67" cy="138" r="18" fill="#101A2E" stroke="#22C55E" stroke-width="8"/>
    <circle cx="88" cy="110" r="20" fill="#101A2E" stroke="#F8FAFC" stroke-opacity="0.82" stroke-width="8"/>
    <circle cx="156" cy="110" r="23" fill="#22C55E"/>
    <circle cx="156" cy="110" r="10" fill="#0B1120"/>
    <circle cx="153" cy="53" r="13" fill="#67E8F9"/>
    <circle cx="153" cy="167" r="13" fill="#84CC16"/>
  </g>

  <g fill="#F8FAFC">
    <text x="238" y="106" font-family="Inter, Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="760" letter-spacing="0">LLM</text>
    <text x="238" y="164" font-family="Inter, Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="760" letter-spacing="0">Hub</text>
  </g>
  <path d="M426 134H642" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M426 134H532" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <text x="426" y="112" fill="#94A3B8" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="3">MODEL ROUTER</text>
</svg>
