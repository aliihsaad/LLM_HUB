<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">LLM Hub</title>
  <desc id="desc">LLM Hub wordmark with a hexagonal model routing mark.</desc>
  <defs>
    <linearGradient id="hub-shell" x1="38" y1="24" x2="206" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cf56e"/>
      <stop offset=".56" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#44e8ee"/>
    </linearGradient>
    <linearGradient id="hub-core" x1="88" y1="72" x2="158" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68f56b"/>
      <stop offset="1" stop-color="#32d9dd"/>
    </linearGradient>
    <linearGradient id="hub-word" x1="425" y1="73" x2="587" y2="141" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#40df58"/>
      <stop offset="1" stop-color="#44e8ee"/>
    </linearGradient>
    <filter id="hub-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity=".34"/>
    </filter>
  </defs>

  <g filter="url(#hub-shadow)">
    <path d="M122 18 210 69v102l-88 51-88-51V69Z" fill="#0a101a" stroke="#182434" stroke-width="5"/>
    <path d="M122 18 210 69v102" fill="none" stroke="url(#hub-shell)" stroke-width="10" stroke-linecap="round"/>
    <path d="M210 171 122 222 34 171V69L122 18" fill="none" stroke="url(#hub-shell)" stroke-width="10" stroke-linecap="round"/>

    <path d="M122 120 76 93M122 120l46-27M122 120 76 147M122 120l46 27" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M122 65v35M122 140v35M76 93v31M168 93v31" fill="none" stroke="#43e5e9" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="2 11"/>

    <circle cx="122" cy="120" r="25" fill="url(#hub-core)"/>
    <circle cx="122" cy="120" r="12" fill="#070b14"/>

    <g fill="#101826" stroke="#f8fafc" stroke-width="7">
      <path d="M122 49 138 58v19l-16 9-16-9V58Z"/>
      <path d="M63 83 79 92v19l-16 9-16-9V92Z"/>
      <path d="M181 83 197 92v19l-16 9-16-9V92Z"/>
      <path d="M63 129 79 138v19l-16 9-16-9v-19Z"/>
      <path d="M181 129 197 138v19l-16 9-16-9v-19Z"/>
      <path d="M122 156 138 165v19l-16 9-16-9v-19Z"/>
    </g>
  </g>

  <g font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0">
    <text x="257" y="126" fill="#f8fafc" font-size="72" font-weight="780">LLM</text>
    <text x="456" y="126" fill="url(#hub-word)" font-size="72" font-weight="780">Hub</text>
    <text x="261" y="166" fill="#94a3b8" font-size="20" font-weight="560">unified model routing</text>
    <path d="M261 185h184" stroke="#243244" stroke-width="3" stroke-linecap="round"/>
    <path d="M261 185h108" stroke="#35d65e" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
